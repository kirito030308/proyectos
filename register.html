<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Registro - Cupet Comercialización</title>
  
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Estilos adicionales para animaciones -->
  <style>
    /* Animaciones de entrada */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-50px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(50px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-20px); }
      60% { transform: translateY(-10px); }
    }
    
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 5px rgba(204, 0, 0, 0.3); }
      50% { box-shadow: 0 0 20px rgba(204, 0, 0, 0.6); }
    }
    
    .animate-fade-in { animation: fadeInUp 0.8s ease forwards; }
    .animate-slide-left { animation: slideInLeft 0.8s ease forwards; }
    .animate-slide-right { animation: slideInRight 0.8s ease forwards; }
    .animate-pulse { animation: pulse 2s infinite; }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-bounce { animation: bounce 1s ease; }
    .animate-glow { animation: glow 2s infinite; }
    
    /* Background particles */
    .bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }
    
    .bg-particle {
      position: absolute;
      background: var(--primary-red);
      border-radius: 50%;
      opacity: 0.05;
      animation: float-particle 20s infinite linear;
    }
    
    @keyframes float-particle {
      from { transform: translateY(100vh) rotate(0deg); }
      to { transform: translateY(-100px) rotate(360deg); }
    }
    
    /* Loading spinner */
    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Form animations */
    .register-container {
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
      position: relative;
      overflow: hidden;
    }
    
    .register-container:hover {
      transform: translateY(-15px) rotateX(5deg) scale(1.02);
      box-shadow: 0 25px 50px rgba(204, 0, 0, 0.2);
    }
    
    .register-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(204, 0, 0, 0.1), transparent);
      transition: left 0.5s ease;
    }
    
    .register-container:hover::before {
      left: 100%;
    }
    
    .form-group {
      transition: all 0.3s ease;
      position: relative;
    }
    
    .form-group:hover {
      transform: translateX(5px);
    }
    
    .form-group input,
    .form-group select {
      transition: all 0.3s ease;
    }
    
    .form-group input:focus,
    .form-group select:focus {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(204, 0, 0, 0.1);
    }
    
    /* Button animations */
    .btn {
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    
    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    
    .btn:hover::before {
      width: 300px;
      height: 300px;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(204, 0, 0, 0.3);
    }
    
    /* Button animations específicas para register */
    .register-btn {
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    
    .register-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    
    .register-btn:hover::before {
      width: 300px;
      height: 300px;
    }
    
    .register-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(204, 0, 0, 0.3);
    }
    
    /* Scroll animations */
    .scroll-reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s ease;
    }
    
    .scroll-reveal.active {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
  
  <style>
    .register-container {
      max-width: 500px;
      margin: 3rem auto;
      padding: 2rem;
      background: white;
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    
    .register-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .register-header img {
      height: 60px;
      margin-bottom: 1rem;
    }
    
    .register-header h2 {
      color: var(--primary-red);
      margin-bottom: 0.5rem;
    }
    
    .register-header p {
      color: #666;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--primary-red);
      font-weight: 600;
    }
    
    .form-group input {
      width: 100%;
      padding: 0.8rem;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: var(--primary-red);
    }
    
    .password-requirements {
      font-size: 0.8rem;
      color: #666;
      margin-top: 0.5rem;
    }
    
    .register-btn {
      width: 100%;
      background: var(--primary-red);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .register-btn:hover {
      background: var(--secondary-green);
    }
    
    .register-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .terms-checkbox {
      display: flex;
      align-items: start;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    
    .terms-checkbox input {
      width: auto;
      margin-top: 0.2rem;
    }
    
    .terms-checkbox label {
      margin: 0;
      font-size: 0.9rem;
      cursor: pointer;
    }
    
    .terms-checkbox a {
      color: var(--primary-red);
      text-decoration: none;
    }
    
    .terms-checkbox a:hover {
      text-decoration: underline;
    }
    
    .login-link {
      text-align: center;
      margin-top: 1.5rem;
    }
    
    .login-link a {
      color: var(--primary-red);
      text-decoration: none;
      font-weight: 600;
    }
    
    .login-link a:hover {
      text-decoration: underline;
    }
    
    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 0.8rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }
    
    .success-message {
      background: #d4edda;
      color: #155724;
      padding: 0.8rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }
    
    /* Animaciones */
    .animate-fade-in {
      animation: fadeIn 1s;
    }
    
    .animate-slide-left {
      animation: slideLeft 0.5s;
    }
    
    .animate-slide-right {
      animation: slideRight 0.5s;
    }
    
    .animate-pulse {
      animation: pulse 1s infinite;
    }
    
    .animate-bounce {
      animation: bounce 1s;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    
    @keyframes slideLeft {
      from {
        transform: translateX(-100%);
      }
      to {
        transform: translateX(0);
      }
    }
    
    @keyframes slideRight {
      from {
        transform: translateX(100%);
      }
      to {
        transform: translateX(0);
      }
    }
    
    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
      }
    }
    
    @keyframes bounce {
      0% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
      100% {
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

<!-- Partículas animadas de fondo -->
<div class="bg-particles" id="bg-particles"></div>

<div class="register-container animate-fade-in">
  <div class="register-header animate-slide-left">
    <img src="images/logo-empresa.jpg" alt="Cupet Logo" class="animate-pulse">
    <h2 class="animate-bounce">Crear Cuenta</h2>
    <p class="animate-slide-right">Únete a Cupet Comercialización</p>
  </div>
  
  <div class="error-message" id="error-message"></div>
  <div class="success-message" id="success-message"></div>
  
  <form id="register-form">
    <div class="form-group animate-slide-left" style="animation-delay: 0.1s;">
      <label for="nombre">Nombre Completo</label>
      <input type="text" id="nombre" name="nombre" required placeholder="Juan Pérez">
    </div>
    
    <div class="form-group animate-slide-left" style="animation-delay: 0.2s;">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="tu@email.cu">
    </div>
    
    <div class="form-group animate-slide-left" style="animation-delay: 0.3s;">
      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" name="telefono" required placeholder="+53 123 456 789">
    </div>
    
    <div class="form-group animate-slide-left" style="animation-delay: 0.4s;">
      <label for="direccion">Dirección</label>
      <input type="text" id="direccion" name="direccion" required placeholder="Calle Martí #123, Las Tunas">
    </div>
    
    <div class="form-group animate-slide-left" style="animation-delay: 0.5s;">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required placeholder="••••••••">
      <div class="password-requirements">
        Mínimo 6 caracteres, incluir mayúsculas, números y símbolos
      </div>
    </div>
    
    <div class="form-group animate-slide-left" style="animation-delay: 0.6s;">
      <label for="confirm-password">Confirmar Contraseña</label>
      <input type="password" id="confirm-password" name="confirm-password" required placeholder="••••••••">
    </div>
    
    <div class="terms-checkbox animate-slide-left" style="animation-delay: 0.7s;">
      <input type="checkbox" id="terms" name="terms" required>
      <label for="terms">Acepto los <a href="#" onclick="showTerms()">términos y condiciones</a> y la <a href="#" onclick="showPrivacy()">política de privacidad</a></label>
    </div>
    
    <button type="submit" class="register-btn animate-pulse" style="animation-delay: 0.8s;">
      <i class="fas fa-user-plus"></i> Crear Cuenta
    </button>
  </form>
  
  <div class="login-link animate-slide-right">
    <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
  </div>
</div>  
  <div style="text-align: center; margin-top: 2rem;">
    <a href="index.html" style="color: var(--primary-red);">
      <i class="fas fa-arrow-left"></i> Volver al inicio
    </a>
  </div>

<script>
// Generar partículas animadas de fondo
function createBackgroundParticles() {
  const container = document.getElementById('bg-particles');
  const particleCount = 10;
  
  for (let i = 0; i < particleCount; i++) {
    const particle = document.createElement('div');
    particle.className = 'bg-particle';
    
    const size = Math.random() * 3 + 1;
    particle.style.width = size + 'px';
    particle.style.height = size + 'px';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.animationDelay = Math.random() * 15 + 's';
    particle.style.animationDuration = (Math.random() * 15 + 15) + 's';
    
    container.appendChild(particle);
  }
}

// Efecto de escritura para el título
function typeWriter(element, text, speed = 50) {
  let i = 0;
  element.textContent = '';
  
  function type() {
    if (i < text.length) {
      element.textContent += text.charAt(i);
      i++;
      setTimeout(type, speed);
    }
  }
  
  type();
}

// Validar contraseña con animación
function validatePassword(password) {
  const minLength = password.length >= 6;
  const hasUpperCase = /[A-Z]/.test(password);
  const hasNumbers = /\d/.test(password);
  const hasSymbols = /[!@#$%^&*(),.?":{}|<>]/.test(password);
  
  return minLength && hasUpperCase && hasNumbers && hasSymbols;
}

// Mostrar mensaje con animación
function showMessage(message, type) {
  const errorDiv = document.getElementById('error-message');
  const successDiv = document.getElementById('success-message');
  
  if (type === 'error') {
    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
    errorDiv.classList.add('animate-bounce');
    successDiv.style.display = 'none';
    
    setTimeout(() => {
      errorDiv.classList.remove('animate-bounce');
    }, 1000);
  } else {
    successDiv.textContent = message;
    successDiv.style.display = 'block';
    successDiv.classList.add('animate-bounce');
    errorDiv.style.display = 'none';
    
    setTimeout(() => {
      successDiv.classList.remove('animate-bounce');
    }, 1000);
  }
  
  // Ocultar mensaje después de 5 segundos
  setTimeout(() => {
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';
  }, 5000);
}

// Manejar registro con animaciones
document.getElementById('register-form').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const formData = new FormData(this);
  const password = formData.get('password');
  const confirmPassword = formData.get('confirm-password');
  const submitBtn = this.querySelector('.btn-primary');
  
  // Validar contraseñas
  if (password !== confirmPassword) {
    showMessage('Las contraseñas no coinciden', 'error');
    
    // Animación de shake en el formulario
    this.classList.add('animate-bounce');
    setTimeout(() => {
      this.classList.remove('animate-bounce');
    }, 1000);
    
    return;
  }
  
  // Validar fortaleza de contraseña
  if (!validatePassword(password)) {
    showMessage('La contraseña debe tener mínimo 6 caracteres, incluir mayúsculas, números y símbolos', 'error');
    return;
  }
  
  // Mostrar loading en el botón
  submitBtn.innerHTML = '<i class="loading-spinner"></i> Creando cuenta...';
  submitBtn.disabled = true;
  
  // Simular registro
  setTimeout(() => {
    const userData = {
      nombre: formData.get('nombre'),
      email: formData.get('email'),
      telefono: formData.get('telefono'),
      direccion: formData.get('direccion'),
      password: password
    };
    
    // Guardar en sessionStorage
    sessionStorage.setItem('userProfile', JSON.stringify(userData));
    
    showMessage('¡Cuenta creada exitosamente! Redirigiendo...', 'success');
    
    // Redirigir al dashboard
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 2000);
  }, 2000);
});

// Efectos de focus en inputs
document.addEventListener('DOMContentLoaded', function() {
  // Crear partículas de fondo
  createBackgroundParticles();
  
  // Activar animaciones de scroll
  handleScrollAnimations();
  
  // Efecto de escritura en el título
  const title = document.querySelector('.register-header h2');
  if (title) {
    const originalText = title.textContent;
    setTimeout(() => {
      typeWriter(title, originalText, 30);
    }, 500);
  }
  
  // Efectos hover en inputs
  const inputs = document.querySelectorAll('input[type="text"], input[type="email"], input[type="tel"], input[type="password"]');
  
  inputs.forEach(input => {
    input.addEventListener('focus', function() {
      this.parentElement.style.transform = 'translateX(10px) scale(1.02)';
      this.parentElement.style.boxShadow = '0 5px 15px rgba(204, 0, 0, 0.2)';
    });
    
    input.addEventListener('blur', function() {
      this.parentElement.style.transform = 'translateX(0) scale(1)';
      this.parentElement.style.boxShadow = '';
    });
  });
  
  // Validación en tiempo real de contraseña
  const passwordInput = document.getElementById('password');
  const confirmPasswordInput = document.getElementById('confirm-password');
  
  confirmPasswordInput.addEventListener('input', function() {
    if (this.value && this.value !== passwordInput.value) {
      this.style.borderColor = '#dc3545';
      this.style.boxShadow = '0 0 10px rgba(220, 53, 69, 0.3)';
    } else if (this.value && this.value === passwordInput.value) {
      this.style.borderColor = '#cc0000';
      this.style.boxShadow = '0 0 10px rgba(204, 0, 0, 0.3)';
    } else {
      this.style.borderColor = '';
      this.style.boxShadow = '';
    }
  });
});

// Animaciones al hacer scroll
function handleScrollAnimations() {
  const reveals = document.querySelectorAll('.scroll-reveal');
  
  reveals.forEach(element => {
    const windowHeight = window.innerHeight;
    const elementTop = element.getBoundingClientRect().top;
    const elementVisible = 150;
    
    if (elementTop < windowHeight - elementVisible) {
      element.classList.add('active');
    }
  });
}

// Efecto de escritura para el título
function typeWriter(element, text, speed = 50) {
  let i = 0;
  element.textContent = '';
  
  function type() {
    if (i < text.length) {
      element.textContent += text.charAt(i);
      i++;
      setTimeout(type, speed);
    }
  }
  
  type();
}

// Event listeners
window.addEventListener('scroll', handleScrollAnimations);

// Efecto de carga suave
window.addEventListener('load', () => {
  document.body.style.opacity = '0';
  setTimeout(() => {
    document.body.style.transition = 'opacity 0.5s ease';
    document.body.style.opacity = '1';
  }, 100);
});

function showTerms() {
  alert('Términos y condiciones de Cupet Comercialización\n\n1. Uso responsable de los servicios\n2. Protección de datos personales\n3. Cumplimiento de regulaciones\n4. Políticas de precios y pagos\n5. Resolución de disputas');
}

function showPrivacy() {
  alert('Política de Privacidad\n\n1. Recopilación de datos\n2. Uso de información\n3. Compartir datos\n4. Seguridad de la información\n5. Derechos del usuario');
}
</script>

<!-- Theme Toggle Script -->
<script src="theme-toggle.js"></script>

</body>
</html>
