<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Login - Cupet Comercialización</title>
  
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  
  <style>
    /* Animaciones de entrada */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-50px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-20px); }
      60% { transform: translateY(-10px); }
    }
    
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(50px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    .animate-fade-in { animation: fadeInUp 0.8s ease forwards; }
    .animate-slide-left { animation: slideInLeft 0.8s ease forwards; }
    .animate-slide-right { animation: slideInRight 0.8s ease forwards; }
    .animate-pulse { animation: pulse 2s infinite; }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-bounce { animation: bounce 1s ease; }
    
    /* Estilos profesionales de login */
    body {
      background: linear-gradient(135deg, #cc0000 0%, #990000 50%, #660000 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      position: relative;
      overflow: auto; /* Cambiado de hidden a auto para permitir scroll */
    }
    
    /* Partículas de fondo */
    .bg-particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }
    
    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: float-particle 20s infinite linear;
    }
    
    @keyframes float-particle {
      from { transform: translateY(100vh) rotate(0deg); }
      to { transform: translateY(-100px) rotate(360deg); }
    }
    
    /* Contenedor principal */
    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    /* Sección de branding */
    .branding-section {
      text-align: center;
      color: white;
      animation: slideInLeft 1s ease;
    }
    
    .branding-section .logo {
      width: 120px;
      height: 120px;
      background: white;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      animation: pulse 3s ease-in-out infinite;
    }
    
    .branding-section .logo img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }
    
    .branding-section h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 1rem;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    
    .branding-section p {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    
    .features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      margin-top: 3rem;
    }
    
    .feature {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }
    
    .feature:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }
    
    .feature i {
      font-size: 1.5rem;
      color: white;
    }
    
    .feature span {
      font-size: 0.95rem;
      font-weight: 500;
    }
    
    /* Formulario de login */
    .login-container {
      background: white;
      border-radius: 24px;
      padding: 3rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 450px;
      position: relative;
      overflow: hidden;
      animation: slideInRight 1s ease;
    }
    
    /* Branding encima del formulario */
    .branding-top {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: slideInLeft 1s ease;
    }
    
    .branding-top .logo {
      width: 80px;
      height: 80px;
      background: white;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      animation: pulse 3s ease-in-out infinite;
    }
    
    .branding-top .logo img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }
    
    .branding-top h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #cc0000;
      margin: 0;
      text-shadow: 0 2px 10px rgba(204, 0, 0, 0.1);
    }
    
    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(204, 0, 0, 0.05), transparent);
      transition: left 0.8s ease;
    }
    
    .login-container:hover::before {
      left: 100%;
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    
    .login-header h2 {
      font-size: 2rem;
      font-weight: 700;
      color: #212529;
      margin-bottom: 0.5rem;
    }
    
    .login-header p {
      color: #6c757d;
      font-size: 1rem;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #495057;
      font-size: 0.95rem;
    }
    
    .form-group input {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: #f8f9fa;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #cc0000;
      background: white;
      box-shadow: 0 0 0 4px rgba(204, 0, 0, 0.1);
    }
    
    .form-group .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #6c757d;
      font-size: 1.1rem;
      margin-top: 0.5rem;
    }
    
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    
    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .remember-me input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #cc0000;
    }
    
    .remember-me label {
      font-size: 0.9rem;
      color: #495057;
      cursor: pointer;
    }
    
    .forgot-password {
      color: #cc0000;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    
    .forgot-password:hover {
      color: #990000;
      text-decoration: underline;
    }
    
    .login-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #cc0000, #990000);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    
    .login-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    
    .login-btn:hover::before {
      width: 300px;
      height: 300px;
    }
    
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(204, 0, 0, 0.3);
    }
    
    .login-btn:active {
      transform: translateY(0);
    }
    
    .divider {
      text-align: center;
      margin: 2rem 0;
      position: relative;
    }
    
    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #e9ecef;
    }
    
    .divider span {
      background: white;
      padding: 0 1rem;
      color: #6c757d;
      font-size: 0.9rem;
      position: relative;
    }
    
    .social-login {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    
    .social-btn {
      padding: 0.8rem;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #495057;
    }
    
    .social-logo {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }
    
    .social-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    
    .social-btn.google:hover {
      border-color: #4285f4;
      color: #4285f4;
    }
    
    .social-btn.facebook:hover {
      border-color: #1877f2;
      color: #1877f2;
    }
    
    .register-link {
      text-align: center;
      color: #6c757d;
      font-size: 0.95rem;
    }
    
    .register-link a {
      color: #cc0000;
      text-decoration: none;
      font-weight: 700;
      transition: color 0.3s ease;
    }
    
    .register-link a:hover {
      color: #990000;
      text-decoration: underline;
    }
    
    /* Loading spinner */
    .loading-spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .login-btn.loading .btn-text {
      display: none;
    }
    
    .login-btn.loading .loading-spinner {
      display: block;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .login-wrapper {
        flex-direction: column;
        gap: 2rem;
        padding: 1rem;
      }
      
      .branding-section {
        display: none;
      }
      
      .login-container {
        max-width: 100%;
        padding: 1.5rem;
        margin: 0 0.5rem;
      }
      
      .features {
        display: none;
      }
      
      .branding-top .logo {
        width: 60px;
        height: 60px;
      }
      
      .branding-top .logo img {
        width: 45px;
        height: 45px;
      }
      
      .login-header h2 {
        font-size: 1.8rem;
      }
      
      .login-header p {
        font-size: 0.95rem;
      }
      
      .form-group input {
        padding: 0.8rem 0.8rem 0.8rem 2.5rem;
        font-size: 0.95rem;
      }
      
      .form-group .input-icon {
        font-size: 1rem;
        margin-top: 0.4rem;
      }
      
      .login-btn {
        padding: 0.9rem;
        font-size: 1rem;
      }
      
      .social-btn {
        padding: 0.7rem;
        font-size: 0.85rem;
      }
      
      .social-logo {
        width: 20px;
        height: 20px;
      }
    }
    
    @media (max-width: 480px) {
      body {
        padding: 0.5rem;
      }
      
      .login-wrapper {
        padding: 0.5rem;
      }
      
      .login-container {
        padding: 1.2rem;
        margin: 0;
      }
      
      .branding-top .logo {
        width: 50px;
        height: 50px;
      }
      
      .branding-top .logo img {
        width: 38px;
        height: 38px;
      }
      
      .login-header h2 {
        font-size: 1.6rem;
      }
      
      .login-header p {
        font-size: 0.9rem;
      }
      
      .form-group {
        margin-bottom: 1.2rem;
      }
      
      .form-group input {
        padding: 0.7rem 0.7rem 0.7rem 2.2rem;
        font-size: 0.9rem;
      }
      
      .form-group .input-icon {
        font-size: 0.9rem;
        margin-top: 0.35rem;
      }
      
      .form-options {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }
      
      .login-btn {
        padding: 0.8rem;
        font-size: 0.95rem;
      }
      
      .social-login {
        grid-template-columns: 1fr;
        gap: 0.8rem;
      }
      
      .social-btn {
        padding: 0.8rem;
        font-size: 0.9rem;
      }
      
      .social-logo {
        width: 18px;
        height: 18px;
      }
      
      .register-link {
        font-size: 0.85rem;
      }
    }
    
    @media (max-width: 360px) {
      .login-container {
        padding: 1rem;
      }
      
      .branding-top .logo {
        width: 45px;
        height: 45px;
      }
      
      .branding-top .logo img {
        width: 34px;
        height: 34px;
      }
      
      .login-header h2 {
        font-size: 1.5rem;
      }
      
      .form-group input {
        padding: 0.6rem 0.6rem 0.6rem 2rem;
        font-size: 0.85rem;
      }
      
      .form-group .input-icon {
        font-size: 0.85rem;
        margin-top: 0.3rem;
      }
    }
  </style>
</head>
<body>

<!-- Partículas animadas de fondo -->
<div class="bg-particles" id="particles"></div>

<div class="login-wrapper">
  <!-- Formulario de Login -->
  <div class="login-container">
    <!-- Logo encima del formulario (sin el texto) -->
    <div class="branding-top">
      <div class="logo">
        <img src="images/logo-empresa.jpg" alt="Cupet">
      </div>
    </div>
    
    <div class="login-header">
      <h2>Bienvenido</h2>
      <p>Inicia sesión para continuar</p>
    </div>
    
    <form id="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <i class="fas fa-envelope input-icon"></i>
        <input type="email" id="email" name="email" placeholder="tu@email.com" required>
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña</label>
        <i class="fas fa-lock input-icon"></i>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      
      <div class="form-options">
        <div class="remember-me">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Recordarme</label>
        </div>
        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
      </div>
      
      <button type="submit" class="login-btn">
        <span class="btn-text">Iniciar Sesión</span>
        <div class="loading-spinner"></div>
      </button>
    </form>
    
    <div class="divider">
      <span>O continuar con</span>
    </div>
    
    <div class="social-login">
      <button class="social-btn google" onclick="socialLogin('google')">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" alt="Google" class="social-logo"> Google
      </button>
      <button class="social-btn facebook" onclick="socialLogin('facebook')">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg" alt="Facebook" class="social-logo"> Facebook
      </button>
    </div>
    
    <div class="register-link">
      ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
    </div>
  </div>
</div>

<script>
// Generar partículas animadas
function createParticles() {
  const particlesContainer = document.getElementById('particles');
  const particleCount = 15;
  
  for (let i = 0; i < particleCount; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    
    const size = Math.random() * 6 + 2;
    particle.style.width = size + 'px';
    particle.style.height = size + 'px';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.animationDelay = Math.random() * 20 + 's';
    particle.style.animationDuration = (Math.random() * 20 + 20) + 's';
    
    particlesContainer.appendChild(particle);
  }
}

// Manejar el formulario de login
document.getElementById('login-form').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const rememberMe = document.getElementById('remember').checked;
  const loginBtn = document.querySelector('.login-btn');
  
  console.log('Intentando login con:', email, password);
  
  // Validación básica
  if (!email || !password) {
    showMessage('Por favor completa todos los campos', 'error');
    return;
  }
  
  // Validación de email
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(email)) {
    showMessage('Por favor ingresa un email válido', 'error');
    return;
  }
  
  // Validación de contraseña
  if (password.length < 6) {
    showMessage('La contraseña debe tener al menos 6 caracteres', 'error');
    return;
  }
  
  // Mostrar loading
  loginBtn.classList.add('loading');
  loginBtn.disabled = true;
  
  // Simular autenticación
  setTimeout(() => {
    // Guardar sesión
    sessionStorage.setItem('userEmail', email);
    sessionStorage.setItem('userLoggedIn', 'true');
    sessionStorage.setItem('isLoggedIn', 'true');
    sessionStorage.setItem('loginTime', new Date().toISOString());
    
    if (rememberMe) {
      localStorage.setItem('userEmail', email);
      localStorage.setItem('rememberMe', 'true');
    }
    
    console.log('Sesión guardada, redirigiendo al dashboard...');
    showMessage('¡Inicio de sesión exitoso!', 'success');
    
    // Redirigir al dashboard
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 1000);
    
  }, 2000);
});

// Login con redes sociales
function socialLogin(provider) {
  showMessage(`Iniciando sesión con ${provider}...`, 'info');
  
  // Simular login social
  setTimeout(() => {
    sessionStorage.setItem('userEmail', `usuario@${provider}.com`);
    sessionStorage.setItem('userLoggedIn', 'true');
    sessionStorage.setItem('isLoggedIn', 'true');
    window.location.href = 'dashboard.html';
  }, 1500);
}

// Mostrar mensajes
function showMessage(message, type = 'info') {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  toast.style.cssText = `
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: ${type === 'error' ? '#dc3545' : type === 'success' ? '#28a745' : '#cc0000'};
    color: white;
    padding: 1rem 1.5rem;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    z-index: 1001;
    animation: slideInRight 0.3s ease;
    font-weight: 600;
  `;
  
  document.body.appendChild(toast);
  
  setTimeout(() => {
    toast.style.animation = 'slideOutRight 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// Recuperar contraseña
document.querySelector('.forgot-password').addEventListener('click', function(e) {
  e.preventDefault();
  showMessage('Función de recuperación de contraseña próximamente', 'info');
});

// Animaciones al hacer scroll
function handleScrollAnimations() {
  const reveals = document.querySelectorAll('.animate-fade-in, .animate-slide-left, .animate-slide-right');
  
  reveals.forEach(element => {
    const windowHeight = window.innerHeight;
    const elementTop = element.getBoundingClientRect().top;
    const elementVisible = 150;
    
    if (elementTop < windowHeight - elementVisible) {
      element.classList.add('active');
    }
  });
}

// Event listeners
window.addEventListener('scroll', handleScrollAnimations);

// Efecto de carga suave
window.addEventListener('load', () => {
  document.body.style.opacity = '0';
  setTimeout(() => {
    document.body.style.transition = 'opacity 0.5s ease';
    document.body.style.opacity = '1';
  }, 100);
});

// Inicializar partículas
document.addEventListener('DOMContentLoaded', function() {
  createParticles();
  handleScrollAnimations();
  
  // Verificar si ya está logueado
  const isLoggedIn = sessionStorage.getItem('userLoggedIn');
  if (isLoggedIn === 'true') {
    console.log('Usuario ya está logueado, redirigiendo al dashboard...');
    window.location.href = 'dashboard.html';
  }
});

// Animación de entrada para inputs
document.querySelectorAll('input').forEach(input => {
  input.addEventListener('focus', function() {
    this.parentElement.style.transform = 'scale(1.02)';
  });
  
  input.addEventListener('blur', function() {
    this.parentElement.style.transform = 'scale(1)';
  });
});
</script>

<!-- Theme Toggle Script -->
<script src="theme-toggle.js"></script>

  <script src="site-enhancements.js" defer></script>
</body>
</html>
